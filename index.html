<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7f1d1d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/2/22/Coat_of_arms_of_the_People%27s_Army_of_Vietnam.svg">
    <title>Sổ tay Giáo dục Chính trị - LLVT Thủ đô</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --military-red: #c41e16; 
            --military-gold: #ffde00;
            --military-deep: #7f1d1d;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            user-select: none;
            overflow-x: hidden;
            margin: 0;
        }
        .trong-dong-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1200px;
            height: 1200px;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/b/b2/Dong_Son_drum_surface.svg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.015;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="trong-dong-overlay"></div>
    <div id="root"></div>

    <script type="module" src="./src/index.tsx"></script>
</body>
</html>
